<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BMTC AI Assistant</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS (served from the project's frontend/ folder, mounted at root by main.py) -->
    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="background"></div>

<div class="chat-container">

    <!-- Header -->

    <div class="header">

        <div class="logo">

            <div class="logo-circle">
                🤖
            </div>

            <div>

                <h2>BMTC AI Assistant</h2>

                <span>BookMyTestCenter RAG Assistant</span>

            </div>

        </div>

        <div class="status">

            <span class="dot" id="statusDot"></span>

            <span id="statusText">Connecting…</span>

        </div>

    </div>

    <!-- Chat -->

    <div id="chat-box" class="chat-box">

        <div class="bot-message">

            <div class="message-header">

                <i class="fa-solid fa-robot"></i>

                BMTC Assistant

            </div>

            <div class="message-body">

                👋 Hello!

                <br><br>

                I'm your intelligent BMTC Assistant.

                <br><br>

                I can answer questions about

                <ul>

                    <li>Center Registration</li>

                    <li>Client Portal</li>

                    <li>Main Website</li>

                    <li>Documents Required</li>

                    <li>Bookings</li>

                    <li>FAQs</li>

                </ul>

                <br>

                Ask me anything 😊

            </div>

        </div>

    </div>

    <!-- Typing -->

    <div id="typing" class="typing">

        <span></span>

        <span></span>

        <span></span>

        BMTC is thinking...

    </div>

    <!-- Input -->

    <div class="input-container">

        <button id="voice-btn"
                class="icon-btn"
                type="button"
                title="Voice input"
                aria-label="Voice input">

            <i class="fa-solid fa-microphone"></i>

        </button>

        <textarea

            id="question"

            rows="1"

            placeholder="Ask anything about BookMyTestCenter..."></textarea>

        <button id="send-btn"
                class="send-btn"
                type="button"
                aria-label="Send message">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
